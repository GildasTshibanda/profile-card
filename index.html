<!DOCTYPE html>
<html lang="fr">
<head>

  <!-- Tailwind CSS -->

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0B0E14;
      color: #E2E8F0;
      overflow-x: hidden;
    }

    /* Carte Glassmorphism minimaliste */
    .glass-card {
      background: rgba(18, 22, 31, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6),
                  0 18px 36px -18px rgba(0, 0, 0, 0.8);
    }

    /* Glow Vert Android */
    .android-glow {
      box-shadow: 0 0 30px rgba(61, 220, 132, 0.2);
    }

    /* Pulse du statut */
    @keyframes statusPulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .status-dot {
      animation: statusPulse 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 relative selection:bg-emerald-500/30">

  <!-- Logo Android en Filigrane (Arrière-plan Motion Design) -->

    <svg id="android-bg-logo" class="w-[320px] sm:w-[480px] h-auto text-emerald-500 fill-current" viewBox="0 0 24 24">
      <path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997 0-.5511.4482-.9993.9993-.9993.5512 0 .9997.4482.9997.9993 0 .5511-.4485.9997-.9997.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997 0-.5511.4482-.9993.9993-.9993.5512 0 .9997.4482.9997.9993 0 .5511-.4485.9997-.9997.9997m11.4045-6.02l1.9973-3.4592c.1284-.2227.0522-.5073-.1705-.6358-.2227-.1282-.5073-.0522-.6358.1705l-2.0306 3.517c-1.545-.7052-3.3276-1.103-5.242-1.103s-3.697.3978-5.242 1.103L3.5273 5.3969c-.1285-.2227-.4131-.2987-.6358-.1705-.2227.1285-.2989.4131-.1705.6358l1.9973 3.4592C1.9839 10.9631.1306 13.9168 0 17.3822h24c-.1306-3.4654-1.9839-6.4191-4.7185-8.0608"/>
    </svg>
  </div>

  <!-- Carte Principale -->
  <main id="profile-card" class="glass-card w-full max-w-md rounded-3xl p-6 sm:p-8 relative z-10 transition-transform duration-200 ease-out">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-8 hero-item">
      <button class="w-10 h-10 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-slate-300 transition-colors">
        <i class="fa-solid fa-wifi text-sm transform -rotate-45"></i>
      </button>

      <div class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium">
        <span class="w-2 h-2 rounded-full bg-emerald-400 status-dot"></span>
        Disponible
      </div>

      <button onclick="shareProfile()" class="w-10 h-10 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-slate-300 transition-colors">
        <i class="fa-solid fa-share-nodes text-sm"></i>
      </button>
    </div>

    <!-- Avatar -->
    <div class="flex justify-center mb-6 hero-item">
      <div class="relative group">
        <div class="absolute -inset-1 rounded-full bg-gradient-to-r from-emerald-500 to-teal-500 opacity-30 blur-sm group-hover:opacity-60 transition duration-500"></div>
        <div class="relative w-28 h-28 rounded-full bg-slate-800 border-2 border-emerald-500/40 p-1 flex items-center justify-center overflow-hidden android-glow">
          <div class="w-full h-full rounded-full bg-gradient-to-br from-slate-800 to-slate-900 flex items-center justify-center text-slate-200 font-bold text-2xl tracking-wider border border-white/10">
            <img src="https://avatars.githubusercontent.com/u/201379793?s=400&u=22c422ed8b246ca84cf7ba2709fffffc0750728f&v=4" alt="Avatar" class="w-full h-full object-cover rounded-full">
          </div>
        </div>
      </div>
    </div>

    <!-- Nom et Titre -->
    <div class="text-center mb-6 hero-item">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white mb-2">
        Gildas Tshibanda
      </h1>
      <p class="text-emerald-400 font-semibold text-sm sm:text-base mb-1">
        Software Engineer Aspiring
      </p>
      <p class="text-slate-400 text-xs sm:text-sm flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-graduation-cap text-slate-500"></i>
        Université de Lubumbashi (UNILU)
      </p>
    </div>

    <!-- Badges Technologies -->
    <div class="flex flex-wrap justify-center gap-2 mb-8 hero-item">
      <span class="px-3 py-1 rounded-lg bg-white/5 border border-white/10 text-xs font-medium text-slate-300 flex items-center gap-1.5">
        <i class="fa-brands fa-android text-emerald-400"></i> Android SDK
      </span>
      <span class="px-3 py-1 rounded-lg bg-white/5 border border-white/10 text-xs font-medium text-slate-300">
        Kotlin
      </span>
      <span class="px-3 py-1 rounded-lg bg-white/5 border border-white/10 text-xs font-medium text-slate-300">

    <!-- Bouton vCard -->
    <div class="mb-8 hero-item">
      <button onclick="downloadVCard()" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-bold text-sm flex items-center justify-center gap-2.5 shadow-lg shadow-emerald-500/20 active:scale-[0.98] transition-all cursor-pointer">
        <i class="fa-solid fa-user-plus text-base"></i>

    </div>

    <!-- Réseaux Sociaux -->
    <div class="grid grid-cols-4 gap-3 pt-6 border-t border-white/10 hero-item">
      <a href="https://github.com/GildasTshibanda" target="_blank" class="flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-white/5 transition-colors group">
        <div class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-slate-300 group-hover:text-white group-hover:border-emerald-500/40 transition-colors">
          <i class="fa-brands fa-github text-lg"></i>
        </div>
        <span class="text-[10px] font-medium text-slate-400 group-hover:text-slate-200">GitHub</span>
      </a>

      <a href="https://www.linkedin.com/in/gildas-tshibanda-3210552aa" target="_blank" class="flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-white/5 transition-colors group">
        <div class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-slate-300 group-hover:text-white group-hover:border-emerald-500/40 transition-colors">
          <i class="fa-brands fa-linkedin-in text-lg"></i>
        </div>
        <span class="text-[10px] font-medium text-slate-400 group-hover:text-slate-200">LinkedIn</span>
      </a>


      <a href="https://x.com/GildasTshi85588" target="_blank" class="flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-white/5 transition-colors group">
        <div class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-slate-300 group-hover:text-white group-hover:border-emerald-500/40 transition-colors">
          <i class="fa-brands fa-x text-lg"></i>
        </div>
        <span class="text-[10px] font-medium text-slate-400 group-hover:text-slate-200">X</span>
      </a>

      <a href="https://medium.com/@gildastshibanda" target="_blank" class="flex flex-col items-center gap-1.5 p-2 rounded-xl hover:bg-white/5 transition-colors group">
        <div class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-slate-300 group-hover:text-white group-hover:border-emerald-500/40 transition-colors">
          <i class="fa-brands fa-medium text-lg"></i>
        </div>
        <span class="text-[10px] font-medium text-slate-400 group-hover:text-slate-200">Medium</span>
      </a>
    </div>

    <!-- Footer -->
    <div class="mt-6 pt-4 border-t border-white/5 text-center hero-item">
      <p class="text-[11px] text-slate-500 font-medium">
        Lubumbashi, DRC &bull; Android & Software Engineering
      </p>
    </div>
  </main>


  <!-- Scripts GSAP & Logique -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Animation d'apparition GSAP
      gsap.from(".hero-item", {
        y: 25,
        opacity: 0,
        duration: 0.8,
        stagger: 0.1,
        ease: "power3.out"
      });

      // Motion Design du logo Android en arrière-plan
      gsap.to("#android-bg-logo", {
        y: -15,
        rotation: 3,
        duration: 4,
        repeat: -1,
        yoyo: true,
        ease: "sine.easeInOut"
      });

      // Effet Tilt 3D
      const card = document.getElementById("profile-card");
      document.addEventListener("mousemove", (e) => {
        const xAxis = (window.innerWidth / 2 - e.pageX) / 35;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 35;
        card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
      });

      document.addEventListener("mouseleave", () => {
        card.style.transform = `rotateY(0deg) rotateX(0deg)`;
      });
    });

    // Générer et télécharger le contact vCard (.vcf)
    function downloadVCard() {
      const vcardData = `BEGIN:VCARD
VERSION:3.0
FN:Gildas Tshibanda
TITLE:Software Engineer Aspiring
ORG:Université de Lubumbashi (UNILU)
NOTE:Développeur Android / Kotlin
END:VCARD`;

      const blob = new Blob([vcardData], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.setAttribute("download", "Gildas_Tshibanda.vcf");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      showToast("Fichier contact (.vcf) téléchargé !");
    }

    // Partage
    function shareProfile() {
      if (navigator.share) {
        navigator.share({
          title: "Profil Gildas Tshibanda",
          text: "Découvrez le profil de Gildas Tshibanda - Software Engineer Aspiring",
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        showToast("Lien copié dans le presse-papier !");
      }
    }

    // Toast
    function showToast(message) {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toast-message");
      toastMsg.innerText = message;
      toast.classList.remove("opacity-0", "pointer-events-none");
      toast.classList.add("opacity-100");

      setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0", "pointer-events-none");
      }, 2500);
    }
  </script>
</body>
</html>
